[package]
name = "db-import"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
chrono = "0.4.37"
crossbeam = "0.8.4"
dotenv = "0.15.0"
flate2 = "1.0.28"
futures = "0.3.30"
indicatif = "0.17.8"
postgis = "0.9.0"
regex = "1.10.4"
serde = { version = "1.0.197", features = ["derive"] }
serde_json = "1.0.115"
sqlx = { version = "0.7.4", features = [ "postgres", "macros", "runtime-tokio", "tls-native-tls", "chrono" ] }
tar = "0.4.40"
threadpool = "1.8.1"
tokio = { version = "1.37.0", features = ["full"] }
zip-extensions = "0.6.2"
