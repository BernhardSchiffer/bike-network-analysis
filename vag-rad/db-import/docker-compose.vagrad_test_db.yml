version: "3.3"

services:
  vag-rad-db-testing:
    image: postgis/postgis:16-master
    container_name: vag-bike-db-testing
    shm_size: 2gb
    volumes:
      - ./dump:/dumpfiles
      - vag_bike_db_testing:/var/lib/postgresql/data:rw
    environment:
      POSTGRES_USER: ${TEST_POSTGRES_USER}
      POSTGRES_PASSWORD: ${TEST_POSTGRES_PASSWORD}
      POSTGRES_DB: ${TEST_POSTGRES_DB}
      PGDATA: /var/lib/postgresql/data/
    ports:
      - ${TEST_POSTGRES_PORT}:5432

volumes:
  vag_bike_db_testing:
    external: true
